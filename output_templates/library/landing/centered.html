{# Centered minimal: centred headline, the form in the middle, then a two-column benefits list. #}
<div data-lp-block="header"></div>
<section class="t-cm-top">
  <div class="container t-cm-center">
    <p class="t-cm-pill">{{ t.eyebrow }}</p>
    <h1>{{ t.headline }}</h1>
    <p class="t-cm-sub">{{ t.sub }}</p>
  </div>
</section>
<section class="t-cm-formwrap">
  <div class="container"><div class="t-cm-form"><div data-lp-block="form"></div></div></div>
</section>
<section class="lp-section t-cm-inside">
  <div class="container t-cm-narrow">
    <h2>Inside this guide</h2>
    <p class="t-cm-intro">{{ t.intro }}</p>
    <ul class="t-cm-list">
      {% for b in t.bullets %}<li>{{ b }}</li>{% endfor %}
    </ul>
  </div>
</section>
<div data-lp-block="footer"></div>
<style>
.t-cm-top { background:linear-gradient(180deg, #eef4ff 0%, #ffffff 100%); padding:64px 0 24px; }
.t-cm-center { text-align:center; max-width:820px; }
.t-cm-pill { display:inline-block; background:#fff; border:1px solid var(--line); color:var(--primary); border-radius:20px; padding:5px 14px; font-weight:700; font-size:13px; letter-spacing:.05em; text-transform:uppercase; margin:0 0 18px; }
.t-cm-center h1 { color:var(--heading); font-size:clamp(30px, 4.2vw, 50px); line-height:1.12; margin:0 0 16px; }
.t-cm-sub { color:var(--muted); font-size:19px; margin:0 auto; max-width:640px; }
.t-cm-formwrap { padding:16px 0 56px; }
.t-cm-form { max-width:520px; margin:0 auto; }
.t-cm-form .form-card { position:static; }
.t-cm-inside { background:#f8fafc; padding:56px 0; }
.t-cm-narrow { max-width:820px; }
.t-cm-inside h2 { text-align:center; color:var(--heading); margin:0 0 10px; font-size:28px; }
.t-cm-intro { text-align:center; color:var(--muted); margin:0 0 28px; }
.t-cm-list { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:1fr 1fr; gap:14px 28px; }
.t-cm-list li { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px 14px 46px; position:relative; color:var(--text); }
.t-cm-list li::before { content:"✓"; position:absolute; left:14px; top:13px; width:22px; height:22px; border-radius:50%; background:color-mix(in srgb, var(--primary) 14%, #fff); color:var(--primary); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
@media (max-width:720px) { .t-cm-list { grid-template-columns:1fr; } }
</style>
