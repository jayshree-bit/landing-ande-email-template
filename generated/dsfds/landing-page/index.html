<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsfds</title>
  <link rel="stylesheet" href="assets/style.css">

<style>
</style><script>document.documentElement.classList.add('lp-js');setTimeout(function(){if(!window.LP_FX)document.documentElement.classList.remove('lp-js')},2500);</script></head>
<body>
<div class="visual-body"><div data-lp-block="header"><header class="site-header" id="site-header">
  <div class="container header-inner">
<span></span>  </div>
</header>
</div>
<div data-lp-block="banner"></div>
<section class="lp-section">
  <div class="container main-grid">
    <div class="content">
      <div class="rich"></div>
    </div>
<div data-lp-block="form">  <aside class="form-card" id="form">
<h2>Download the eBook</h2>
    <form id="lead-form" novalidate>
      <div class="fields">
          <div class="field half">
            <label for="f_first_name">First Name <b class="req">*</b></label>
              <input id="f_first_name" data-field-id="f_first_name" name="first_name" type="text" placeholder="" required class="">
            <small class="error-msg"></small>
          </div>
          <div class="field half">
            <label for="f_last_name">Last Name <b class="req">*</b></label>
              <input id="f_last_name" data-field-id="f_last_name" name="last_name" type="text" placeholder="" required class="">
            <small class="error-msg"></small>
          </div>
          <div class="field full">
            <label for="f_business_email">Business Email <b class="req">*</b></label>
              <input id="f_business_email" data-field-id="f_business_email" name="business_email" type="email" placeholder="" autocomplete="email" required class="">
            <small class="error-msg"></small>
          </div>
          <div class="field half">
            <label for="f_phone_number">Phone Number</label>
              <input id="f_phone_number" data-field-id="f_phone_number" name="phone_number" type="tel" placeholder="" autocomplete="tel" class="">
            <small class="error-msg"></small>
          </div>
          <div class="field half">
            <label for="f_company_name">Company Name <b class="req">*</b></label>
              <input id="f_company_name" data-field-id="f_company_name" name="company_name" type="text" placeholder="" required class="">
            <small class="error-msg"></small>
          </div>
          <div class="field half">
            <label for="f_job_title">Job Title <b class="req">*</b></label>
              <input id="f_job_title" data-field-id="f_job_title" name="job_title" type="text" placeholder="" required class="">
            <small class="error-msg"></small>
          </div>
          <div class="field half">
            <label for="f_country">Country <b class="req">*</b></label>
              <div class="select-wrap">
                <select id="f_country" data-field-id="f_country" name="country" required class="">
                  <option value="">Select</option>
<option value="India">India</option><option value="United States">United States</option><option value="United Kingdom">United Kingdom</option><option value="Canada">Canada</option><option value="Australia">Australia</option><option value="Singapore">Singapore</option><option value="United Arab Emirates">United Arab Emirates</option><option value="Germany">Germany</option><option value="Other">Other</option>                </select>
              </div>
            <small class="error-msg"></small>
          </div>
      </div>

      <input type="hidden" name="utm_source" value="">
      <input type="hidden" name="utm_medium" value="">
      <input type="hidden" name="utm_campaign" value="">
      <input type="hidden" name="utm_term" value="">
      <input type="hidden" name="utm_content" value="">
      <input type="text" name="website_hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="consent">
          <label class="check consent-check">
            <input type="checkbox" name="consent" value="Yes" required>
            <span><p>I agree to receive communications and accept the privacy policy.</p></span>
          </label>
        </div>
      <button type="submit" class="btn">Download Now</button>
      <p class="form-error" role="alert" hidden></p>
    </form>
  </aside>
</div>  </div>
</section>
<div data-lp-block="footer"><footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-grid footer-grid-3">



    </div>
  </div>
  <div class="footer-bottom">
    <div class="container"></div>
  </div>
</footer>
</div></div>
<script>window.LP_CONFIG = {"campaign": "dsfds", "formAction": "http://127.0.0.1:5050/api/submit/dsfds", "submitText": "Download Now", "thankYouUrl": "thank-you.html"};</script>
<script src="assets/script.js"></script>
<script src="assets/effects.js"></script></body>
</html>
