<script>
  (function () {
    function normalizeToken(value) {
      return (value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function applySubmittedValues() {
      var params = new URLSearchParams(location.search);
      var values = {};
      params.forEach(function (value, key) {
        if (key === 'submitted' || key === 'preview') return;
        values[normalizeToken(key)] = value;
      });

      function replaceToken(match, token) {
        var key = normalizeToken(token);
        return Object.prototype.hasOwnProperty.call(values, key) ? values[key] : match;
      }

      var roots = document.querySelector('.visual-body') ? [document.querySelector('.visual-body')]
        : [document.querySelector('h1'), document.querySelector('.rich'), document.getElementById('pdf-link'), document.getElementById('ty-note')];
      roots.forEach(function (root) {
        if (!root) return;
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var textNode;
        while ((textNode = walker.nextNode())) {
          textNode.nodeValue = textNode.nodeValue.replace(/\[([^\]]+)\]/g, replaceToken);
        }
      });
    }

    applySubmittedValues();
  })();
</script>
