<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Portal</title>
<style>
  :root { --p:#2563eb; --ink:#0f172a; --line:#e2e8f0; --muted:#64748b; --bg:#f1f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header.top { background:var(--ink); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; }
  header.top h1 { font-size:18px; margin:0; flex:1; }
  .btn { background:var(--p); color:#fff; border:0; padding:10px 16px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  main { max-width:1280px; margin:0 auto; padding:24px; }
  .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .toolbar input { flex:1; min-width:220px; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; }
  .toolbar select { padding:10px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; background:#fff; }
  .stats { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-width:160px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .15s; }
  .card:hover { box-shadow:0 8px 24px rgba(15,23,42,.1); }
  .thumb { height:140px; background:#e2e8f0 center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; }
  .body { padding:14px 16px; flex:1; }
  .body h3 { margin:0 0 4px; font-size:15px; line-height:1.35; }
  .meta { color:var(--muted); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .badge { background:#eef2ff; color:#3730a3; border-radius:20px; padding:1px 8px; font-weight:600; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 14px; }
  .actions a, .actions button { font:inherit; font-size:12.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; text-decoration:none; }
  .actions .primary { background:var(--p); color:#fff; border-color:var(--p); }
  .actions .danger { color:#b91c1c; }
  .menu { position:relative; }
  .menu-list { display:none; position:absolute; right:0; bottom:110%; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(15,23,42,.12); min-width:190px; z-index:5; padding:4px; }
  .menu.open .menu-list { display:block; }
  .menu-list a { display:block; border:0 !important; padding:8px 10px !important; }
  .menu-list a:hover { background:#f1f5f9; }
  .empty { text-align:center; padding:60px 20px; color:var(--muted); background:#fff; border:1px dashed #cbd5e1; border-radius:12px; }
</style>
</head>
<body>
<header class="top">
  <h1>LP &amp; Email Campaign Portal</h1>
  <a class="btn" href="/templates" style="background:#7c3aed">✨ Start from a template</a>
  <a class="btn" href="/builder">+ New campaign</a>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input id="search" placeholder="Search campaigns…">
    <select id="sort">
      <option value="updated">Recently updated</option>
      <option value="created">Recently created</option>
      <option value="name">Name A–Z</option>
      <option value="leads">Most leads</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
const $ = s => document.querySelector(s);
let items = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) : '—';

async function load() {
  items = await (await fetch('/api/campaigns')).json();
  const leads = items.reduce((a, c) => a + c.leads, 0);
  $('#stats').innerHTML = `<div class="stat"><b>${items.length}</b><span>Campaigns</span></div>
    <div class="stat"><b>${leads}</b><span>Total leads</span></div>`;
  render();
}

function render() {
  const q = $('#search').value.toLowerCase();
  const sort = $('#sort').value;
  let list = items.filter(c => (c.name + ' ' + c.partner + ' ' + c.slug).toLowerCase().includes(q));
  list.sort((a, b) => sort === 'name' ? a.name.localeCompare(b.name)
    : sort === 'leads' ? b.leads - a.leads
    : String(b[sort + '_at'] || '').localeCompare(String(a[sort + '_at'] || '')));
  if (!items.length) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><p>No campaigns yet.</p><a class="btn" href="/templates" style="background:#7c3aed">Start from a template</a> &nbsp; <a class="btn" href="/builder">Create a blank campaign</a></div>`;
    return;
  }
  $('#grid').innerHTML = list.map(c => `
    <div class="card">
      <div class="thumb" style="${c.thumb ? `background-image:url('${esc(c.thumb)}')` : ''}" onclick="location.href='/builder/${c.slug}'">${c.thumb ? '' : 'No banner'}</div>
      <div class="body">
        <h3>${esc(c.name)}</h3>
        <div class="meta"><span class="badge">${c.leads} leads</span>${c.partner ? `<span>${esc(c.partner)}</span>` : ''}<span>Updated ${fmt(c.updated_at)}</span></div>
      </div>
      <div class="actions">
        <a class="primary" href="/builder/${c.slug}">Edit</a>
        <a href="/c/${c.slug}/landing-page/index.html" target="_blank">Landing page</a>
        <a href="/c/${c.slug}/email-template/email.html" target="_blank">Email</a>
        <span class="menu"><button onclick="toggleMenu(event, this)">Download ▾</button>
          <span class="menu-list">
            <a href="/download/${c.slug}.zip">Full ZIP (LP + Email)</a>
            <a href="/download/${c.slug}.zip?part=landing">Landing page ZIP</a>
            <a href="/download/${c.slug}.zip?part=email">Email template ZIP</a>
            <a href="/api/campaigns/${c.slug}/leads.csv">Leads CSV</a>
          </span></span>
        <button onclick="duplicate('${c.slug}')">Duplicate</button>
        <button class="danger" onclick="removeCampaign('${c.slug}', '${esc(c.name).replace(/'/g, '&#39;')}')">Delete</button>
      </div>
    </div>`).join('');
}

function toggleMenu(e, btn) {
  e.stopPropagation();
  const m = btn.parentElement, open = m.classList.contains('open');
  document.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open'));
  if (!open) m.classList.add('open');
}
document.addEventListener('click', () => document.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open')));

async function duplicate(slug) {
  const r = await fetch(`/api/campaigns/${slug}/duplicate`, {method:'POST'});
  if (r.ok) location.href = '/builder/' + (await r.json()).slug;
}
async function removeCampaign(slug, name) {
  if (!confirm(`Delete "${name}"? Its pages, files and leads will be removed permanently.`)) return;
  await fetch('/api/campaigns/' + slug, {method:'DELETE'});
  load();
}
$('#search').oninput = render;
$('#sort').onchange = render;
load();
</script>
</body>
</html>
